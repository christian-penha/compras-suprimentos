<form method="get" class="basis-full mt-1 flex flex-wrap gap-3">
  {% if visao %}<input type="hidden" name="visao" value="{{ visao }}">{% endif %}
  <input name="q" value="{{ busca }}" placeholder="{{ placeholder|default:'Buscar por nome…' }}" autocomplete="off"
         class="flex-1 min-w-[220px] rounded-xl border border-[#2c2c2c] bg-[#1c1c1c] px-4 py-3 text-sm text-white placeholder-[#7a7a7a] focus:outline-none focus:ring-2 focus:ring-white">
  {% if filiais %}
  <select name="filial" onchange="this.form.submit()" class="rounded-xl border border-[#2c2c2c] bg-[#1c1c1c] px-4 py-3 text-sm text-white focus:outline-none focus:ring-2 focus:ring-white">
    <option value="">Todas as unidades</option>
    {% for f in filiais %}<option value="{{ f.pk }}" {% if filial_id == f.pk|stringformat:"s" %}selected{% endif %}>{{ f.nome }}</option>{% endfor %}
  </select>
  {% endif %}
  <button class="rounded-xl bg-white text-[#0a0a0a] text-sm font-semibold px-5 py-3 hover:bg-slate-200 transition">Filtrar</button>
</form>
