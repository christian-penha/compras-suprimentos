{# Alternador de visualização. Recebe `opcoes` (lista de pares valor/rótulo) e `agrupar`. #}
<div class="flex gap-1 rounded-xl bg-slate-100 border border-slate-200 dark:bg-slate-800 dark:border-slate-700 p-1 text-sm">
  {% for o in opcoes %}
  <a href="?agrupar={{ o.0 }}" data-param="agrupar" data-valor="{{ o.0 }}"
     class="rounded-lg px-3.5 py-2 font-medium transition {% if agrupar == o.0 %}bg-white text-teal-800 shadow-sm dark:bg-slate-700 dark:text-white{% else %}text-slate-500 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white{% endif %}">{{ o.1 }}</a>
  {% endfor %}
</div>
