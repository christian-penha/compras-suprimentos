{% extends "base.html" %}
{% block titulo %}Entrar — Compras & Suprimentos{% endblock %}
{% block conteudo %}
<div class="min-h-[70vh] flex items-center justify-center">
  <div class="w-full max-w-md">
    <div class="text-center mb-8">
      <span class="inline-flex h-14 w-14 items-center justify-center rounded-3xl bg-blue-600 text-white text-2xl mb-3">⬡</span>
      <h1 class="text-2xl font-semibold text-slate-800">Compras & Suprimentos</h1>
      <p class="text-slate-500 text-sm mt-1">Acesse com seu usuário do grupo</p>
    </div>
    <form method="post" class="bg-white rounded-3xl shadow-sm border border-slate-200 p-8 space-y-5">
      {% csrf_token %}
      {% if form.errors %}
        <div class="rounded-2xl bg-red-50 border border-red-100 text-red-700 text-sm px-4 py-3">
          Usuário ou senha inválidos.
        </div>
      {% endif %}
      <div>
        <label for="id_username" class="block text-sm font-medium text-slate-600 mb-1.5">Usuário</label>
        <input type="text" name="username" id="id_username" autofocus autocomplete="username"
               class="w-full rounded-xl border-slate-200 px-4 py-2.5 text-sm focus:border-blue-400 focus:ring-blue-400">
      </div>
      <div>
        <label for="id_password" class="block text-sm font-medium text-slate-600 mb-1.5">Senha</label>
        <input type="password" name="password" id="id_password" autocomplete="current-password"
               class="w-full rounded-xl border-slate-200 px-4 py-2.5 text-sm focus:border-blue-400 focus:ring-blue-400">
      </div>
      <button class="w-full rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 transition">
        Entrar
      </button>
    </form>
  </div>
</div>
{% endblock %}
