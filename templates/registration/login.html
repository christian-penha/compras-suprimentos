{% extends "base.html" %}
{% load static %}
{% block titulo %}Entrar — Compras & Suprimentos{% endblock %}
{% block conteudo %}
<div class="min-h-[70vh] flex items-center justify-center">
  <div class="w-full max-w-sm">
    <div class="text-center mb-6">
      <img src="{% static 'img/logo-perfil.png' %}" alt="Grupo Perfil de Educação" class="h-14 mx-auto mb-4">
      <h1 class="text-xl font-semibold text-white">Sistema de Pedidos</h1>
    </div>
    <form method="post" class="bg-[#0a0a0a] border border-[#232323] rounded-2xl p-8 space-y-4">
      {% csrf_token %}
      {% if form.errors %}
        <div class="rounded-xl bg-red-950/60 border border-red-900 text-red-300 text-sm px-4 py-3">
          Usuário ou senha inválidos.
        </div>
      {% endif %}
      <div>
        <label for="id_username" class="block text-sm font-semibold text-[#b3b3b3] mb-1.5">Usuário</label>
        <input type="text" name="username" id="id_username" autofocus autocomplete="username"
               class="w-full rounded-lg border border-[#2c2c2c] bg-[#1c1c1c] px-4 py-2.5 text-sm text-white focus:outline-none focus:ring-2 focus:ring-white">
      </div>
      <div>
        <label for="id_password" class="block text-sm font-semibold text-[#b3b3b3] mb-1.5">Senha</label>
        <input type="password" name="password" id="id_password" autocomplete="current-password"
               class="w-full rounded-lg border border-[#2c2c2c] bg-[#1c1c1c] px-4 py-2.5 text-sm text-white focus:outline-none focus:ring-2 focus:ring-white">
      </div>
      <button class="w-full rounded-lg bg-white hover:bg-slate-200 text-[#0a0a0a] font-bold py-2.5 transition">
        Entrar
      </button>
    </form>
  </div>
</div>
{% endblock %}
